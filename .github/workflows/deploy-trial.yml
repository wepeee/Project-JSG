name: Deploy Trial

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger_vercel:
        description: "Trigger Vercel Deploy Hook after successful migration"
        required: false
        default: true
        type: boolean
      baseline_existing_db:
        description: "One-time baseline for existing non-empty DB (P3005)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-trial-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality-gate:
    name: Quality Gate (Typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  migrate-trial:
    name: Migrate Trial Database
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.TRIAL_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.TRIAL_DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Optional baseline existing DB (one-time)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_existing_db }}
        run: |
          set -e
          for dir in prisma/migrations/*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            echo "Marking migration as applied: $name"
            pnpm prisma migrate resolve --applied "$name" || true
          done

      - name: Prisma migrate deploy
        run: pnpm db:migrate

      - name: Prisma migration status
        run: pnpm prisma migrate status

  verify-dev-trial-schema-sync:
    name: Verify DEV vs TRIAL Schema Sync
    needs: migrate-trial
    runs-on: ubuntu-latest
    env:
      DEV_DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}
      TRIAL_DIRECT_URL: ${{ secrets.TRIAL_DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required DB URLs
        run: |
          if [ -z "$DEV_DIRECT_URL" ]; then
            echo "::error::Missing DEV_DIRECT_URL secret."
            exit 1
          fi
          if [ -z "$TRIAL_DIRECT_URL" ]; then
            echo "::error::Missing TRIAL_DIRECT_URL secret."
            exit 1
          fi

      - name: Check schema drift (DEV -> TRIAL)
        run: |
          set +e
          pnpm prisma migrate diff \
            --from-url "$DEV_DIRECT_URL" \
            --to-url "$TRIAL_DIRECT_URL" \
            --exit-code
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 0 ]; then
            echo "Schema DEV dan TRIAL sinkron."
            exit 0
          fi

          if [ "$exit_code" -eq 2 ]; then
            echo "::error::Schema drift terdeteksi antara DEV dan TRIAL."
            echo "Detail diff:"
            pnpm prisma migrate diff \
              --from-url "$DEV_DIRECT_URL" \
              --to-url "$TRIAL_DIRECT_URL" \
              --script
            exit 1
          fi

          echo "::error::prisma migrate diff gagal dijalankan (exit $exit_code)."
          exit "$exit_code"

  trigger-vercel:
    name: Trigger Vercel Deploy Hook (Optional)
    needs: verify-dev-trial-schema-sync
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.trigger_vercel) }}
    steps:
      - name: Skip when deploy hook secret is missing
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is empty. Skipping trigger."
            exit 0
          fi
          echo "Deploy hook is configured."

      - name: Call Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Skipping deploy hook call."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
